[workspace]
members = [".", "libmseed-wasm"]

[package]
name = "libmseed"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Pure-Rust, safe port of libmseed: read, write and manage miniSEED 2 and 3 seismological data"
license = "Apache-2.0"
repository = "https://github.com/EarthScope/libmseed-rs"
readme = "README.md"
keywords = ["miniseed", "seismology", "seed", "geophysics", "timeseries"]
categories = ["science", "parser-implementations", "encoding"]
exclude = [".github/", "libmseed-wasm/", "fuzz/", "design.md"]

[dependencies]
bitflags = "2"
log = "0.4"
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[profile.release]
lto = true
codegen-units = 1
